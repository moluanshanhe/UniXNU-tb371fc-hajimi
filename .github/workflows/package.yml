name: package

# Standard UniXNU device packaging workflow (docs/porting/packaging.md).
# Runs scripts/package.sh on a macOS runner alongside UniXNU/UniXNU and
# Denis0x00/uefi-j716f. Because the platform seed (UNIXNU_UNIQUE_CHIP_ID) is
# baked into the images, run this only in a private/personal fork and delete
# the run after downloading the artifacts.
#
# Additional hardware requirement: provide the normalized stock DTB
# (see proprietary-files.txt) via a local checkout or DTB URL/secret when
# assembling boot.img for real hardware.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["17"]
        default: "17"
      check_only:
        description: "Run scripts/package.sh --check only (preflight & patch list)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: device
          submodules: recursive

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: UniXNU/UniXNU
          ref: main
          path: UniXNU
          submodules: recursive

      - name: Apply pending upstream UniXNU core patches for TB-J716F
        run: |
          for patch in device/patches/unixnu-core/*.patch; do
            git -C UniXNU apply --check "$PWD/$patch"
            git -C UniXNU apply "$PWD/$patch"
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Denis0x00/uefi-j716f
          ref: main
          path: uefi-j716f
          submodules: false

      - name: Initialize required uefi-j716f Mu submodules and apply TB371FC 2944x1840 patch
        run: |
          git -C uefi-j716f submodule update --init --depth 1 Common/Mu Common/Mu_OEM_Sample
          git -C uefi-j716f apply --check "$PWD/device/patches/uefi-tb371fc/tb371fc-2944x1840.patch"
          git -C uefi-j716f apply "$PWD/device/patches/uefi-tb371fc/tb371fc-2944x1840.patch"

      - name: Install macOS host tools
        run: |
          brew install dtc llvm lld cmake mtools blacktop/tap/ipsw
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]

      - name: Validate platform seed
        if: ${{ !inputs.check_only }}
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8,16}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID (8-16 hex digits).' >&2
            exit 1
          fi

      - name: Select Python 3.12 for Data seed builder
        id: python
        if: ${{ inputs.check_only != true }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Checkout pinned UniXNU core for Data seed creation
        if: ${{ inputs.check_only != true }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: UniXNU/UniXNU
          ref: 7b730b231746667d8b7f54746c2c1ce45852611c
          path: .ci-unixnu
          persist-credentials: false
          submodules: false

      - name: Create and verify fresh Data seed (data-21H461.dbr)
        if: ${{ inputs.check_only != true }}
        env:
          PYTHON_BIN: ${{ steps.python.outputs.python-path }}
          DATA_ARTIFACT: ${{ runner.temp }}/tb371fc-data-seed-artifact
        run: |
          git -C .ci-unixnu submodule update --init --depth=1 drivers/DarwinBoot
          sudo -n "$PYTHON_BIN" device/scripts/ci/make_data_seed.py \
            --core "$GITHUB_WORKSPACE/.ci-unixnu" \
            --work "$RUNNER_TEMP/tb371fc-data-seed-work" \
            --output "$DATA_ARTIFACT" \
            --evidence "$RUNNER_TEMP/tb371fc-data-seed-evidence" \
            --gib 16
          sudo -n chown -R "$(id -u):$(id -g)" "$DATA_ARTIFACT"
          sudo -n rm -rf "$RUNNER_TEMP/tb371fc-data-seed-work" "$GITHUB_WORKSPACE/.ci-unixnu"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          meta = json.loads((Path(os.environ["DATA_ARTIFACT"]) / "data-21H461.json").read_text())
          uuid = meta["data_volume_uuid"]
          cfg = Path("device/configs/j716f_defconfig")
          text = cfg.read_text()
          updated = re.sub(r'CONFIG_XNU_OWNER_DATA_VOLUME_UUID="[^"]+"', f'CONFIG_XNU_OWNER_DATA_VOLUME_UUID="{uuid}"', text)
          cfg.write_text(updated)
          print(f"Bound fresh Data UUID: {uuid}")
          PY

      - name: Run scripts/package.sh
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          OS_TARGET: ${{ inputs.os || '17' }}
          DATA_SEED: ${{ runner.temp }}/tb371fc-data-seed-artifact/data-21H461.dbr
          J716F_GPU_FIRMWARE_DIR: ${{ github.workspace }}/device/package/firmware/gpu
        run: |
          if [ "${{ inputs.check_only }}" = "true" ]; then
            scripts/package.sh --os "$OS_TARGET" --check --uefi ../uefi-j716f
          else
            scripts/package.sh --os "$OS_TARGET" --uefi ../uefi-j716f --data-ramdisk "$DATA_SEED"
          fi

      - name: Upload images
        if: ${{ inputs.check_only != true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: images-tb371fc-ios${{ inputs.os || '17' }}
          retention-days: 7
          if-no-files-found: error
          path: |
            UniXNU/out/j716f/*/*/boot/boot.img
            UniXNU/out/j716f/*/*/payload/payload.img
            UniXNU/out/j716f/*/*/kernel/kernel.macho
            UniXNU/out/j716f/*/*/package.manifest.json
            ${{ runner.temp }}/tb371fc-data-seed-artifact/data-21H461.dbr
            ${{ runner.temp }}/tb371fc-data-seed-artifact/data-21H461.json
